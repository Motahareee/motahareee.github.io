<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motahare Mounesan</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #F8F7F3; }
#graph { display: block; width: 100%; height: 100%; cursor: default; }

#back-btn {
  position: fixed; top: 1.8rem; left: 1.8rem; z-index: 40;
  display: flex; align-items: center; gap: 0.45rem;
  padding: 0.48rem 1.1rem; border-radius: 100px;
  background: rgba(26,25,20,0.04);
  border: 1px solid rgba(26,25,20,0.12);
  color: rgba(26,25,20,0.5);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase;
  cursor: pointer; backdrop-filter: blur(20px);
  transition: opacity 0.3s, color 0.2s, background 0.2s;
  opacity: 0; pointer-events: none;
}
#back-btn.visible { opacity: 1; pointer-events: all; }
#back-btn:hover   { background: rgba(26,25,20,0.07); color: rgba(26,25,20,0.9); }

#hint {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(26,25,20,0.22); pointer-events: none;
  transition: opacity 0.5s; white-space: nowrap;
}

/* terminal panel */
#terminal {
  position: fixed; top: 0; right: 0; height: 100%; width: 400px; z-index: 50;
  background: #0D1117;
  border-left: 1px solid rgba(255,255,255,0.07);
  box-shadow: -20px 0 60px rgba(0,0,0,0.18);
  display: flex; flex-direction: column;
  font-family: 'JetBrains Mono', monospace;
  transform: translateX(100%);
  transition: transform 0.42s cubic-bezier(0.16,1,0.3,1);
  pointer-events: none;
}
#terminal.open { transform: translateX(0); pointer-events: all; }
.term-titlebar {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.85rem 1.2rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.term-dots { display: flex; gap: 6px; }
.term-dot { width: 12px; height: 12px; border-radius: 50%; }
.term-dot.r { background: #FF5F57; } .term-dot.y { background: #FEBC2E; } .term-dot.g { background: #28C840; }
.term-path {
  flex: 1; font-size: 0.62rem; color: rgba(255,255,255,0.25);
  letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.term-path b { color: rgba(255,255,255,0.6); font-weight: 500; }
#term-close {
  background: none; border: none; color: rgba(255,255,255,0.2);
  font-size: 1rem; cursor: pointer; padding: 0; line-height: 1;
  transition: color 0.15s;
}
#term-close:hover { color: rgba(255,255,255,0.6); }
#term-body {
  flex: 1; overflow-y: auto; padding: 1.4rem 1.5rem 2rem;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
}
.term-cmd {
  font-size: 0.65rem; color: rgba(255,255,255,0.22);
  letter-spacing: 0.04em; margin-bottom: 1.6rem;
}
.term-cmd span { color: rgba(255,255,255,0.45); }
.term-item { margin-bottom: 1.5rem; animation: termFadeIn 0.3s ease both; }
@keyframes termFadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.term-item-head {
  display: flex; align-items: baseline; gap: 0.55rem;
  font-size: 0.8rem; font-weight: 500; margin-bottom: 0.3rem;
}
.term-arrow { font-size: 0.65rem; flex-shrink: 0; }
.term-item-title { color: rgba(255,255,255,0.88); }
.term-item-title a { color: inherit; text-decoration: none; }
.term-item-title a:hover { text-decoration: underline; }
.term-item-meta {
  font-size: 0.62rem; color: rgba(255,255,255,0.28);
  padding-left: 1.2rem; margin-bottom: 0.25rem; letter-spacing: 0.02em;
}
.term-item-gist {
  font-size: 0.63rem; line-height: 1.65;
  color: rgba(255,255,255,0.38); padding-left: 1.2rem;
  font-family: 'Inter', sans-serif; font-weight: 300;
}
.term-divider {
  border: none; border-top: 1px solid rgba(255,255,255,0.06);
  margin: 0 0 1.5rem;
}
.term-cursor { display: inline-block; animation: blink 1.1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.term-cursor-line { font-size: 0.65rem; color: rgba(255,255,255,0.22); margin-top: 1rem; }
@media (max-width: 600px) {
  #terminal { width: 100%; height: 62vh; top: auto; bottom: 0; right: 0;
    border-left: none; border-top: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px 16px 0 0;
    transform: translateY(100%); }
  #terminal.open { transform: translateY(0); }
  #back-btn { top: 1rem; left: 1rem; }
  #hint { font-size: 0.48rem; letter-spacing: 0.1em; bottom: 1.2rem; }
}
</style>
</head>
<body>
<svg id="graph"></svg>

<button id="back-btn">
  <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
    <path d="M5.5 1.5L2.5 4.5L5.5 7.5" stroke="currentColor" stroke-width="1.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  Overview
</button>
<div id="hint">Select a node to explore &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Drag to pan</div>
<div id="terminal">
  <div class="term-titlebar">
    <div class="term-dots">
      <div class="term-dot r"></div>
      <div class="term-dot y"></div>
      <div class="term-dot g"></div>
    </div>
    <div class="term-path">~/motahare/<b id="term-cat-slug">—</b></div>
    <button id="term-close" aria-label="Close">✕</button>
  </div>
  <div id="term-body"></div>
</div>

<script>
'use strict';

// ══════════════════════════════════════════════════════
//  PALETTE
// ══════════════════════════════════════════════════════
const PAL = {
  education:  '#6D28D9',
  experience: '#047857',
  research:   '#1D4ED8',
  contact:    '#92400E',
};

// ══════════════════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════════════════
const CATS = [
  {
    id: 'education', label: 'Education', icon: '🎓',
    items: [
      {
        label: 'Ph.D. in Computer Science', degree: 'Doctor of Philosophy',
        dept: 'Department of Computer Science',
        org: 'The Graduate Center', uni: 'City University of New York',
        sub: '2022 – 2025', logo: { text: 'GC', color: '#1B4D8E' },
        href: 'https://www.gc.cuny.edu'
      },
    ]
  },
  {
    id: 'experience', label: 'Experience', icon: '💼',
    items: [
      { label: 'Postdoctoral RA',      detail: 'Texas A&M University',         sub: '2025 – Present' },
      { label: 'Research Assistant',   detail: 'The Graduate Center, CUNY',    sub: '2022 – 2025'   },
      { label: 'Research Assistant',   detail: 'NYU Center for Urban Science', sub: '2017 – 2021'   },
    ]
  },
  {
    id: 'research', label: 'Research', icon: '🔬',
    items: [
      {
        label: 'Edge Intelligence',
        gist: 'Designing systems that run DNN inference at the network edge under tight latency and resource constraints.',
        sub: ''
      },
      {
        label: 'Reinforcement Learning',
        gist: 'Applying RL to orchestrate resource allocation and decision-making in dynamic edge environments.',
        sub: ''
      },
      {
        label: 'Multimodal AI',
        gist: 'Enabling vision and language models to collaborate under real-world compute limits.',
        sub: ''
      },
      {
        label: 'Adversarial Security',
        gist: 'Studying how adversarial attacks exploit collaborative inference pipelines and building defenses.',
        sub: ''
      },
      {
        label: 'Inference Optimization',
        gist: 'Optimizing inference-time execution to meet strict latency budgets on heterogeneous hardware.',
        sub: ''
      },
    ]
  },
  {
    id: 'contact', label: 'Contact', icon: '✉️',
    items: [
      { label: 'Academic Email',   detail: 'motahare@tamu.edu',        sub: 'TAMU',       href: 'mailto:motahare@tamu.edu' },
      { label: 'Google Scholar',   detail: 'Publications & citations', sub: '',           href: 'https://scholar.google.com/citations?user=c5teoEQAAAAJ' },
      { label: 'GitHub',           detail: 'Open-source repositories', sub: 'Motahareee', href: 'https://github.com/Motahareee' },
      { label: 'LinkedIn',         detail: 'Professional profile',     sub: '',           href: 'https://linkedin.com/in/motahare-mounesan' },
    ]
  },
];
CATS.forEach(c => { c.color = PAL[c.id]; });

// ══════════════════════════════════════════════════════
//  GEOMETRY
// ══════════════════════════════════════════════════════
const SUN_R  = 120;
const NODE_R = 40;
const SUB_OR = 175;
const RW     = 162;   // fixed block width for research nodes (title + line + gist)

// Asymmetric layout: each node has its own angle and orbit radius
// Left edges shorter, right edges longer — feels organic, not mechanical
const LAYOUT = [
  { angle: -155, orbit: 200 },   // Education   — short left arm
  { angle: -112, orbit: 268 },   // Experience  — medium left
  { angle:  -60, orbit: 310 },   // Research    — long right (biggest node)
  { angle:  -22, orbit: 230 },   // Contact     — medium-short right
];
CATS.forEach((c, i) => {
  c.angle = LAYOUT[i].angle * Math.PI / 180;
  c.x = Math.cos(c.angle) * LAYOUT[i].orbit;
  c.y = Math.sin(c.angle) * LAYOUT[i].orbit;
});

// ══════════════════════════════════════════════════════
//  SVG + DEFS
// ══════════════════════════════════════════════════════
let W = window.innerWidth, H = window.innerHeight;
const svg  = d3.select('#graph').attr('width', W).attr('height', H);
const defs = svg.append('defs');

/* glow filters */
const mkGlow = (id, dev, mul) => {
  const f = defs.append('filter').attr('id', id)
    .attr('x', '-120%').attr('y', '-120%').attr('width', '340%').attr('height', '340%');
  const blur = f.append('feGaussianBlur').attr('stdDeviation', dev).attr('result', 'b');
  if (mul) f.append('feComposite').attr('in', 'b').attr('operator', 'over').attr('in2', 'b').attr('result', 'b2');
  const m = f.append('feMerge');
  m.append('feMergeNode').attr('in', mul ? 'b2' : 'b');
  m.append('feMergeNode').attr('in', 'SourceGraphic');
};
mkGlow('glow-xs',  3);
mkGlow('glow-sm',  6);
mkGlow('glow-md', 12);
mkGlow('glow-lg', 22);

/* sun clip — upper half (y < 0) */
defs.append('clipPath').attr('id', 'sun-clip')
  .append('rect').attr('x', -2000).attr('y', -2000).attr('width', 4000).attr('height', 2000);

/* sun radial gradient — warm sunrise */
const sunGrad = defs.append('radialGradient').attr('id', 'sun-grad')
  .attr('cx', '50%').attr('cy', '100%').attr('r', '100%');
sunGrad.append('stop').attr('offset',  '0%').attr('stop-color', '#FFF8EC').attr('stop-opacity', 1);
sunGrad.append('stop').attr('offset', '18%').attr('stop-color', '#FBBF24').attr('stop-opacity', 0.85);
sunGrad.append('stop').attr('offset', '42%').attr('stop-color', '#C084FC').attr('stop-opacity', 0.45);
sunGrad.append('stop').attr('offset', '70%').attr('stop-color', '#4338CA').attr('stop-opacity', 0.18);
sunGrad.append('stop').attr('offset','100%').attr('stop-color', '#F8F7F3').attr('stop-opacity', 0);

/* horizon glow gradient */
const hzGrad = defs.append('linearGradient').attr('id', 'hz-grad')
  .attr('x1', '0%').attr('y1', '0%').attr('x2', '100%').attr('y2', '0%');
hzGrad.append('stop').attr('offset',  '0%').attr('stop-color', '#FBBF24').attr('stop-opacity', 0);
hzGrad.append('stop').attr('offset', '30%').attr('stop-color', '#FBBF24').attr('stop-opacity', 0.35);
hzGrad.append('stop').attr('offset', '50%').attr('stop-color', '#FFF8EC').attr('stop-opacity', 0.7);
hzGrad.append('stop').attr('offset', '70%').attr('stop-color', '#FBBF24').attr('stop-opacity', 0.35);
hzGrad.append('stop').attr('offset','100%').attr('stop-color', '#FBBF24').attr('stop-opacity', 0);

/* per-cat: orb gradient & edge gradient */
CATS.forEach(c => {
  // node orb (soft glow disc)
  const og = defs.append('radialGradient').attr('id', `og-${c.id}`)
    .attr('cx', '50%').attr('cy', '50%').attr('r', '50%');
  og.append('stop').attr('offset',  '0%').attr('stop-color', c.color).attr('stop-opacity', 0.62);
  og.append('stop').attr('offset', '50%').attr('stop-color', c.color).attr('stop-opacity', 0.18);
  og.append('stop').attr('offset','100%').attr('stop-color', c.color).attr('stop-opacity', 0);

  // node core bright spot
  const cg = defs.append('radialGradient').attr('id', `cg-${c.id}`)
    .attr('cx', '42%').attr('cy', '38%').attr('r', '55%');
  cg.append('stop').attr('offset',  '0%').attr('stop-color', '#ffffff').attr('stop-opacity', 0.6);
  cg.append('stop').attr('offset', '60%').attr('stop-color', c.color ).attr('stop-opacity', 0.2);
  cg.append('stop').attr('offset','100%').attr('stop-color', c.color ).attr('stop-opacity', 0);

  // edge gradient
  const eg = defs.append('linearGradient').attr('id', `eg-${c.id}`)
    .attr('gradientUnits', 'userSpaceOnUse')
    .attr('x1', 0).attr('y1', 0).attr('x2', c.x).attr('y2', c.y);
  eg.append('stop').attr('offset',  '0%').attr('stop-color', '#D4A017').attr('stop-opacity', 0.3);
  eg.append('stop').attr('offset','100%').attr('stop-color', c.color  ).attr('stop-opacity', 0.55);
});

/* background gradient */
const bgGrad = defs.append('radialGradient').attr('id', 'bg-grad')
  .attr('cx', '50%').attr('cy', '52%').attr('r', '58%');
bgGrad.append('stop').attr('offset',  '0%').attr('stop-color', '#F0EFE9');
bgGrad.append('stop').attr('offset','100%').attr('stop-color', '#F8F7F3');

// ══════════════════════════════════════════════════════
//  ZOOM + SCENE
// ══════════════════════════════════════════════════════
function getViewScale() {
  // Scene content spans roughly ±265px horizontally, -350 to +130 vertically
  const sx = (W * 0.90) / 530;
  const sy = (H * 0.88) / 490;
  return Math.min(sx, sy, 1.1);
}

const scene = svg.append('g');
const zoomB = d3.zoom().scaleExtent([0.1, 8])
  .on('zoom', e => scene.attr('transform', e.transform));
svg.call(zoomB);
svg.call(zoomB.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(getViewScale()));
svg.on('click', () => { if (STATE === 'expanded') collapse(); });

// ══════════════════════════════════════════════════════
//  BACKGROUND
// ══════════════════════════════════════════════════════
const bgLayer = scene.append('g').attr('pointer-events', 'none');

bgLayer.append('rect')
  .attr('x', -9999).attr('y', -9999).attr('width', 19998).attr('height', 19998)
  .attr('fill', 'url(#bg-grad)');

// two-scale dot grid for visual depth
[{ s: 28, r: 0.65, o: 0.07 }, { s: 84, r: 1.4, o: 0.04 }].forEach(({ s, r, o }, li) => {
  const pid = `dp${li}`;
  const p = defs.append('pattern').attr('id', pid)
    .attr('width', s).attr('height', s).attr('patternUnits', 'userSpaceOnUse');
  p.append('circle').attr('cx', 1).attr('cy', 1).attr('r', r)
    .attr('fill', `rgba(26,25,20,${o})`);
  bgLayer.append('rect')
    .attr('x', -9999).attr('y', -9999).attr('width', 19998).attr('height', 19998)
    .attr('fill', `url(#${pid})`);
});

// warm ambient wash behind horizon
const warmGrad = defs.append('radialGradient').attr('id', 'warm-wash')
  .attr('cx', '50%').attr('cy', '100%').attr('r', '70%');
warmGrad.append('stop').attr('offset',  '0%').attr('stop-color', '#FDE68A').attr('stop-opacity', 0.35);
warmGrad.append('stop').attr('offset','100%').attr('stop-color', '#FDE68A').attr('stop-opacity', 0);
bgLayer.append('ellipse').attr('rx', 700).attr('ry', 320)
  .attr('fill', 'url(#warm-wash)');

// ══════════════════════════════════════════════════════
//  OVERVIEW EDGES (sun center → primary nodes)
// ══════════════════════════════════════════════════════
const ovEdgeLayer = scene.append('g').attr('pointer-events', 'none');
const ovEdgeSel = {};
CATS.forEach(c => {
  // bloom
  ovEdgeLayer.append('line')
    .attr('x1', 0).attr('y1', -SUN_R * 0.1).attr('x2', c.x).attr('y2', c.y)
    .attr('stroke', c.color).attr('stroke-width', 5).attr('stroke-opacity', 0.08)
    .attr('filter', 'url(#glow-sm)');
  // crisp
  ovEdgeSel[c.id] = ovEdgeLayer.append('line')
    .attr('x1', 0).attr('y1', -SUN_R * 0.1).attr('x2', c.x).attr('y2', c.y)
    .attr('stroke', `url(#eg-${c.id})`).attr('stroke-width', 0.8);
});

// ══════════════════════════════════════════════════════
//  RISING SUN
// ══════════════════════════════════════════════════════
const sunG = scene.append('g').attr('pointer-events', 'none');

// outermost atmosphere glow
sunG.append('circle').attr('class', 'sun-pulse')
  .attr('r', SUN_R * 1.5).attr('fill', 'none')
  .attr('stroke', '#FBBF24').attr('stroke-width', 1)
  .attr('stroke-opacity', 0.12).attr('filter', 'url(#glow-lg)')
  .attr('clip-path', 'url(#sun-clip)');

// corona rings
[1.25, 1.08].forEach((mult, ri) => {
  sunG.append('circle')
    .attr('r', SUN_R * mult)
    .attr('fill', 'none')
    .attr('stroke', '#FBBF24')
    .attr('stroke-width', ri === 0 ? 0.5 : 0.7)
    .attr('stroke-opacity', ri === 0 ? 0.15 : 0.25)
    .attr('clip-path', 'url(#sun-clip)');
});

// main sun body (clipped semicircle)
sunG.append('circle')
  .attr('r', SUN_R)
  .attr('fill', 'url(#sun-grad)')
  .attr('clip-path', 'url(#sun-clip)')
  .attr('filter', 'url(#glow-md)');

// pulse animation
(function pulse() {
  sunG.select('.sun-pulse')
    .transition().duration(3200).ease(d3.easeSinInOut)
      .attr('r', SUN_R * 1.75).attr('stroke-opacity', 0.22)
    .transition().duration(3200).ease(d3.easeSinInOut)
      .attr('r', SUN_R * 1.5).attr('stroke-opacity', 0.08)
    .on('end', pulse);
})();

// ══════════════════════════════════════════════════════
//  HORIZON LINE
// ══════════════════════════════════════════════════════
const horizG = scene.append('g').attr('pointer-events', 'none');

// bloom layer
horizG.append('line')
  .attr('x1', -1800).attr('y1', 0).attr('x2', 1800).attr('y2', 0)
  .attr('stroke', '#FBBF24').attr('stroke-width', 10).attr('stroke-opacity', 0.08)
  .attr('filter', 'url(#glow-sm)');

// need a fixed-size gradient rect for the horizon (linearGradient with userSpace)
const hzG2 = defs.append('linearGradient').attr('id', 'hz2')
  .attr('gradientUnits', 'userSpaceOnUse')
  .attr('x1', -800).attr('y1', 0).attr('x2', 800).attr('y2', 0);
hzG2.append('stop').attr('offset',  '0%').attr('stop-color', '#FBBF24').attr('stop-opacity', 0);
hzG2.append('stop').attr('offset', '30%').attr('stop-color', '#FBBF24').attr('stop-opacity', 0.25);
hzG2.append('stop').attr('offset', '50%').attr('stop-color', '#FFF8EC').attr('stop-opacity', 0.5);
hzG2.append('stop').attr('offset', '70%').attr('stop-color', '#FBBF24').attr('stop-opacity', 0.25);
hzG2.append('stop').attr('offset','100%').attr('stop-color', '#FBBF24').attr('stop-opacity', 0);

horizG.append('line')
  .attr('x1', -800).attr('y1', 0).attr('x2', 800).attr('y2', 0)
  .attr('stroke', 'url(#hz2)').attr('stroke-width', 1);

// ══════════════════════════════════════════════════════
//  NAME + TAGLINE (below horizon)
// ══════════════════════════════════════════════════════
const labelG = scene.append('g').attr('pointer-events', 'none');

labelG.append('text')
  .attr('y', 40).attr('text-anchor', 'middle')
  .attr('font-family', "'Playfair Display', Georgia, serif")
  .attr('font-size', '26px').attr('font-weight', '400').attr('fill', 'rgba(26,25,20,0.88)')
  .attr('letter-spacing', '0.01em')
  .text('Motahare Mounesan');

labelG.append('text')
  .attr('y', 62).attr('text-anchor', 'middle')
  .attr('font-family', "'JetBrains Mono', monospace")
  .attr('font-size', '9px').attr('font-weight', '400')
  .attr('fill', 'rgba(146,64,14,0.6)').attr('letter-spacing', '0.2em')
  .text('RESEARCHER  &  ENGINEER');

// Bio — two short lines below tagline
const bioLines = [
  'I build systems that learn, adapt, and decide',
  'where computation is scarce and intelligence must travel light.',
];
bioLines.forEach((line, i) => {
  labelG.append('text')
    .attr('y', 90 + i * 18).attr('text-anchor', 'middle')
    .attr('font-family', 'Inter, sans-serif')
    .attr('font-size', '11px').attr('font-weight', '300')
    .attr('fill', 'rgba(26,25,20,0.45)').attr('letter-spacing', '0.01em')
    .text(line);
});

// ══════════════════════════════════════════════════════
//  PRIMARY NODES  (soft orbs, no sharp border)
// ══════════════════════════════════════════════════════
const primLayer = scene.append('g');
const primSel   = {};

CATS.forEach(c => {
  const g = primLayer.append('g')
    .attr('transform', `translate(${c.x},${c.y})`)
    .attr('cursor', 'pointer');
  primSel[c.id] = g;

  // large outer soft bloom
  g.append('circle').attr('class', 'bloom')
    .attr('r', NODE_R * 1.9).attr('fill', `url(#og-${c.id})`)
    .attr('filter', 'url(#glow-sm)').attr('pointer-events', 'none');

  // inner bright orb
  g.append('circle').attr('class', 'core')
    .attr('r', NODE_R * 0.72).attr('fill', `url(#cg-${c.id})`)
    .attr('pointer-events', 'none');

  // hit target (invisible, defines click area)
  g.append('circle').attr('r', NODE_R * 1.4)
    .attr('fill', 'transparent').attr('stroke', 'none');

  // custom CS icon
  drawIcon(g, c.id, c.color);

  // label below orb
  g.append('text')
    .attr('y', NODE_R + 18).attr('text-anchor', 'middle')
    .attr('font-family', 'Inter, sans-serif')
    .attr('font-size', '10.5px').attr('font-weight', '500').attr('letter-spacing', '0.1em')
    .attr('fill', 'rgba(26,25,20,0.55)').attr('text-transform', 'uppercase')
    .attr('pointer-events', 'none')
    .text(c.label.toUpperCase());

  // hover
  g.on('mouseenter', function () {
    if (STATE === 'expanded' && ACTIVE !== c.id) return;
    d3.select(this).select('.bloom').transition().duration(220)
      .attr('r', NODE_R * 2.3);
    d3.select(this).select('.core').transition().duration(220)
      .attr('r', NODE_R * 0.86);
  }).on('mouseleave', function () {
    d3.select(this).select('.bloom').transition().duration(220)
      .attr('r', NODE_R * 1.9);
    d3.select(this).select('.core').transition().duration(220)
      .attr('r', NODE_R * 0.72);
  }).on('click', function (e) {
    e.stopPropagation();
    if (STATE === 'overview') expand(c);
    else if (STATE === 'expanded' && ACTIVE === c.id) collapse();
  });
});

// ══════════════════════════════════════════════════════
//  SUB-NODES  (floating pill cards)
// ══════════════════════════════════════════════════════
//  TERMINAL PANEL
// ══════════════════════════════════════════════════════
const termEl   = document.getElementById('terminal');
const termBody = document.getElementById('term-body');
document.getElementById('term-close').addEventListener('click', e => {
  e.stopPropagation(); collapse();
});

function showTerminal(cat) {
  document.getElementById('term-cat-slug').textContent = cat.id;
  termBody.innerHTML = '';

  // shell prompt line
  const cmd = document.createElement('div');
  cmd.className = 'term-cmd';
  cmd.innerHTML = `<span style="color:${cat.color}">❯</span> <span>ls ./${cat.id}/</span>`;
  termBody.appendChild(cmd);

  cat.items.forEach((item, i) => {
    const block = document.createElement('div');
    block.className = 'term-item';
    block.style.animationDelay = `${i * 70}ms`;

    // header row: arrow + title (linkable if href exists)
    const head = document.createElement('div');
    head.className = 'term-item-head';
    const arrow = document.createElement('span');
    arrow.className = 'term-arrow';
    arrow.style.color = cat.color;
    arrow.textContent = '▸';
    head.appendChild(arrow);
    const title = document.createElement('span');
    title.className = 'term-item-title';
    if (item.href) {
      const a = document.createElement('a');
      a.href = item.href; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = item.label;
      title.appendChild(a);
    } else {
      title.textContent = item.label;
    }
    head.appendChild(title);
    block.appendChild(head);

    // meta line (org/detail + year)
    const metaParts = [];
    if (item.org)    metaParts.push(item.org + ', CUNY');
    if (item.detail) metaParts.push(item.detail);
    if (item.sub)    metaParts.push(item.sub);
    if (metaParts.length) {
      const meta = document.createElement('div');
      meta.className = 'term-item-meta';
      meta.textContent = metaParts.join('  ·  ');
      block.appendChild(meta);
    }

    // gist paragraph (research)
    if (item.gist) {
      const gist = document.createElement('div');
      gist.className = 'term-item-gist';
      gist.textContent = item.gist;
      block.appendChild(gist);
    }

    termBody.appendChild(block);

    // thin divider between items
    if (i < cat.items.length - 1) {
      const hr = document.createElement('hr');
      hr.className = 'term-divider';
      termBody.appendChild(hr);
    }
  });

  // blinking cursor at the end
  const cur = document.createElement('div');
  cur.className = 'term-cursor-line';
  cur.innerHTML = `<span style="color:${cat.color}">❯</span> <span class="term-cursor">▌</span>`;
  termBody.appendChild(cur);

  termEl.classList.add('open');
}

function hideTerminal() { termEl.classList.remove('open'); }

// ══════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════
let STATE  = 'overview';
let ACTIVE = null;

const backBtn = document.getElementById('back-btn');
const hintEl  = document.getElementById('hint');

backBtn.addEventListener('click', e => { e.stopPropagation(); collapse(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') collapse(); });

function expand(cat) {
  STATE = 'expanded'; ACTIVE = cat.id;
  backBtn.classList.add('visible');
  hintEl.style.opacity = '0';

  CATS.forEach(d => {
    const dim = d.id !== cat.id;
    primSel[d.id].transition().duration(380).attr('opacity', dim ? 0.12 : 1);
    ovEdgeSel[d.id].transition().duration(380).attr('opacity', dim ? 0.04 : 0.9);
  });
  sunG.transition().duration(380).attr('opacity', 0.35);
  horizG.transition().duration(380).attr('opacity', 0.25);
  labelG.transition().duration(380).attr('opacity', 0.18);

  showTerminal(cat);
}

function collapse() {
  if (STATE !== 'expanded') return;
  STATE = 'overview'; ACTIVE = null;
  backBtn.classList.remove('visible');
  hintEl.style.opacity = '1';

  hideTerminal();

  CATS.forEach(c => {
    primSel[c.id].transition().duration(400).attr('opacity', 1);
    ovEdgeSel[c.id].transition().duration(400).attr('opacity', 1);
  });
  sunG.transition().duration(400).attr('opacity', 1);
  horizG.transition().duration(400).attr('opacity', 1);
  labelG.transition().duration(400).attr('opacity', 1);

  svg.transition().duration(680).ease(d3.easeCubicInOut)
    .call(zoomB.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(getViewScale()));
}

// ══════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════
function drawIcon(parent, id, color) {
  const g = parent.append('g').attr('pointer-events', 'none');
  const sw = 1.7;
  const base = { fill: 'none', stroke: color, 'stroke-width': sw,
                 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
  const apply = el => Object.entries(base).forEach(([k, v]) => el.attr(k, v));

  if (id === 'education') {
    // graduation cap + tassel
    apply(g.append('polyline').attr('points', '-12,2 0,-8 12,2'));
    apply(g.append('path').attr('d', 'M-8,2 L-8,9 Q0,14 8,9 L8,2'));
    g.append('line').attr('x1', -12).attr('y1', 2).attr('x2', 12).attr('y2', 2)
      .attr('stroke', color).attr('stroke-width', sw).attr('stroke-linecap', 'round');
    g.append('line').attr('x1', 10).attr('y1', 2).attr('x2', 10).attr('y2', 9)
      .attr('stroke', color).attr('stroke-width', sw).attr('stroke-linecap', 'round');
    g.append('circle').attr('cx', 10).attr('cy', 11).attr('r', 2).attr('fill', color);

  } else if (id === 'experience') {
    // </> terminal brackets
    apply(g.append('polyline').attr('points', '-5,-9 -12,0 -5,9'));
    apply(g.append('polyline').attr('points', '5,-9 12,0 5,9'));
    g.append('line').attr('x1', -2).attr('y1', -10).attr('x2', 2).attr('y2', 10)
      .attr('stroke', color).attr('stroke-width', sw).attr('stroke-linecap', 'round');

  } else if (id === 'research') {
    // atom: nucleus + 3 orbits at 0°, 60°, -60°
    g.append('circle').attr('r', 2.8).attr('fill', color);
    [0, 60, -60].forEach(deg =>
      g.append('ellipse').attr('rx', 11).attr('ry', 4)
        .attr('transform', `rotate(${deg})`)
        .attr('fill', 'none').attr('stroke', color).attr('stroke-width', sw * 0.85)
    );

  } else if (id === 'contact') {
    // envelope with fold
    apply(g.append('rect').attr('x', -12).attr('y', -8).attr('width', 24).attr('height', 16).attr('rx', 2));
    apply(g.append('polyline').attr('points', '-12,-8 0,4 12,-8'));
  }
}

function txt(g, t, y, size, weight, fill) {
  g.append('text').attr('y', y).attr('text-anchor', 'middle')
    .attr('dominant-baseline', 'central')
    .attr('font-family', 'Inter, sans-serif')
    .attr('font-size', size + 'px').attr('font-weight', weight)
    .attr('fill', fill).attr('pointer-events', 'none').text(t);
}
function mono(g, t, y, size, fill, op) {
  g.append('text').attr('y', y).attr('text-anchor', 'middle')
    .attr('dominant-baseline', 'central')
    .attr('font-family', "'JetBrains Mono', monospace")
    .attr('font-size', size + 'px').attr('fill', fill).attr('fill-opacity', op)
    .attr('letter-spacing', '0.06em').attr('pointer-events', 'none').text(t);
}
function midSplit(text, max) {
  if (text.length <= max) return [text, null];
  const words = text.split(' ');
  if (words.length < 2) return [text, null];
  let best = 1, bestDiff = Infinity, run = words[0].length;
  for (let i = 1; i < words.length - 1; i++) {
    const d = Math.abs(run - text.length / 2);
    if (d < bestDiff) { best = i; bestDiff = d; }
    run += 1 + words[i].length;
  }
  return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
}

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  svg.attr('width', W).attr('height', H);
  if (STATE === 'overview')
    svg.call(zoomB.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(getViewScale()));
});

// Touch-friendly hint
if ('ontouchstart' in window) {
  document.getElementById('hint').innerHTML =
    'Tap a node &nbsp;·&nbsp; Pinch to zoom &nbsp;·&nbsp; Drag to pan';
}
</script>
